{% extends 'base.html' %}{% import '_m.html' as m with context %}{% block title %}Account{% endblock %}{% block body %}
<h1>Account</h1><p class="sub">{{ me.email }} · role: {{ me.role }}</p>
<div class="card" style="max-width:460px"><h2>Change password</h2><form method="post">{{ m.csrf() }}
<label>Current password</label><input type="password" name="current" required autocomplete="current-password">
<label>New password</label><input type="password" name="new" minlength="8" required autocomplete="new-password">
<p><button class="btn p">Change password</button></p></form></div>{% endblock %}
